name: Publish APKShellExt release

on:
  push:
    branches:
      - 'publish/v*'
    paths:
      - '.github/release-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Checkout exact release commit with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build application
        shell: pwsh
        run: msbuild ApkShellext2.sln /restore /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
      - name: Build smoke tests
        shell: pwsh
        run: msbuild smoke-tests/ApkReaderSmokeTests.csproj /restore /m /p:Configuration=Release /verbosity:minimal
      - name: Run smoke tests
        shell: pwsh
        run: '& "./smoke-tests/bin/Release/ApkReaderSmokeTests.exe"'
      - name: Build updated WebP for both Windows architectures
        shell: pwsh
        run: ./scripts/build-libwebp.ps1
      - name: Verify and package release payload
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Verify standalone release dependencies in 64-bit and 32-bit .NET Framework
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^ApkShellext2\.(7z|zip)$' } | Select-Object -First 1)
          if ($archive.Count -ne 1) { throw "Missing primary release archive." }
          $script = "./smoke-tests/VerifyPackagedRuntime.ps1"
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ArchivePath $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Standalone x64 release runtime check failed." }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ArchivePath $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Standalone x86 release runtime check failed." }
      - name: Build native Shell COM integration test harness
        shell: pwsh
        run: msbuild smoke-tests/ShellIntegrationTests.csproj /m /p:Configuration=Release /verbosity:minimal
      - name: Install and exercise Windows Shell COM handlers in x64 and x86
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^ApkShellext2\.(7z|zip)$' } | Select-Object -First 1)
          if ($archive.Count -ne 1) { throw "Missing primary release archive." }
          ./smoke-tests/Invoke-ShellIntegration.ps1 -ArchivePath $archive[0].FullName -TestAssembly ./smoke-tests/bin/Release/ShellIntegrationTests.dll
      - name: Publish versioned GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME.Substring('publish/'.Length)
          $requested = (Get-Content '.github/release-trigger.txt' -Raw).Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -ne $requested) {
            throw "Release ref / trigger mismatch: $tag / $requested"
          }
          # A release tag must match the actual shipped CLR/Windows file version.
          $assemblyPath = 'ApkShellext2/bin/Release/ApkShellext2.dll'
          $expectedVersion = [Version]($tag.Substring(1) + '.0')
          $actualVersion = [Reflection.AssemblyName]::GetAssemblyName(
            (Resolve-Path -LiteralPath $assemblyPath).Path).Version
          if ($actualVersion -ne $expectedVersion) {
            throw "Release $tag does not match assembly version $actualVersion"
          }
          if (@(Get-ChildItem -Path 'dist' -File -Filter 'zh-CN.*').Count -ne 0) {
            throw 'Simplified Chinese is embedded in the main DLL; do not publish a separate zh-CN pack.'
          }
          $assets = @(Get-ChildItem -Path 'dist' -File | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'There are no release archives.' }
          $notes = "RELEASE_NOTES_$tag.md"
          if (Test-Path -LiteralPath $notes) {
            & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ApkShellExt $tag" --notes-file $notes --latest
          } else {
            & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ApkShellExt $tag" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed: $tag" }
