name: Windows build

on:
  push:
    branches: [ApkShellext2]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout with the original dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build shell extension and original test app
        shell: pwsh
        run: msbuild ApkShellext2.sln /restore /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
      - name: Build original optional service
        shell: pwsh
        run: msbuild ApkShellextService/apkShellextService.csproj /m /p:Configuration=Release /verbosity:minimal
      - name: Build optional HTTP service regression harness
        shell: pwsh
        run: msbuild smoke-tests/ServiceSmokeTests.csproj /m /p:Configuration=Release /verbosity:minimal
      - name: Verify optional service cannot expose arbitrary files
        shell: pwsh
        run: '& "./smoke-tests/bin/Release/ServiceSmokeTests.exe"'
      - name: Build APK reader smoke tests
        shell: pwsh
        run: msbuild smoke-tests/ApkReaderSmokeTests.csproj /restore /m /p:Configuration=Release /verbosity:minimal
      - name: Run APK reader smoke tests
        shell: pwsh
        run: '& "./smoke-tests/bin/Release/ApkReaderSmokeTests.exe"'
      - name: Build updated native WebP libraries for x64 and x86
        shell: pwsh
        run: ./scripts/build-libwebp.ps1
      - name: Verify both WebP architectures and versions
        shell: pwsh
        run: |
          ./scripts/verify-libwebp.ps1 -DllPath ./ApkShellext2/bin/Release/libwebp_x64.dll -Architecture x64
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-libwebp.ps1 -DllPath ./ApkShellext2/bin/Release/libwebp_x86.dll -Architecture x86
          if ($LASTEXITCODE -ne 0) { throw "The x86 WebP version check failed." }
      - name: Verify produced shell extension
        shell: pwsh
        run: |
          if (!(Test-Path "ApkShellext2/bin/Release/ApkShellext2.dll")) {
            throw "Expected shell extension assembly was not produced"
          }
          if (!(Test-Path "ApkShellext2/bin/Release/install.bat")) {
            throw "Original installation script was not copied"
          }
      - name: Build portable release archives
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Verify standalone release dependencies in 64-bit and 32-bit .NET Framework
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^ApkShellext2\.(7z|zip)$' } | Select-Object -First 1)
          if ($archive.Count -ne 1) { throw "Missing primary release archive." }
          $script = "./smoke-tests/VerifyPackagedRuntime.ps1"
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ArchivePath $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Standalone x64 release runtime check failed." }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ArchivePath $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Standalone x86 release runtime check failed." }
      - name: Build native Shell COM integration test harness
        shell: pwsh
        run: msbuild smoke-tests/ShellIntegrationTests.csproj /m /p:Configuration=Release /verbosity:minimal
      - name: Upload compiled Shell COM test harness
        uses: actions/upload-artifact@v7
        with:
          name: apkshellext2-shell-test-harness
          path: smoke-tests/bin/Release/ShellIntegrationTests.dll
          if-no-files-found: error
      - name: Install and exercise Windows Shell COM handlers in x64 and x86
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^ApkShellext2\.(7z|zip)$' } | Select-Object -First 1)
          if ($archive.Count -ne 1) { throw "Missing primary release archive." }
          ./smoke-tests/Invoke-ShellIntegration.ps1 -ArchivePath $archive[0].FullName -TestAssembly ./smoke-tests/bin/Release/ShellIntegrationTests.dll
      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: apkshellext2-release-archives
          path: dist/*
          if-no-files-found: error
      - name: Keep build output for manual Explorer smoke tests
        uses: actions/upload-artifact@v7
        with:
          name: apkshellext2-windows-release
          path: ApkShellext2/bin/Release/
          if-no-files-found: error
  shell-windows-2025:
    name: Installed Shell COM on Windows Server 2025
    needs: build
    runs-on: windows-2025
    steps:
      - name: Checkout test scripts without building dependencies
        uses: actions/checkout@v7
      - name: Download verified release archives from build
        uses: actions/download-artifact@v7
        with:
          name: apkshellext2-release-archives
          path: dist
      - name: Download compiled Shell test harness
        uses: actions/download-artifact@v7
        with:
          name: apkshellext2-shell-test-harness
          path: smoke-tests/bin/Release
      - name: Install and test both COM architectures on Windows Server 2025
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^ApkShellext2\.(7z|zip)$' } | Select-Object -First 1)
          if ($archive.Count -ne 1) { throw "The build artifact lacks the main release archive." }
          ./smoke-tests/Invoke-ShellIntegration.ps1 -ArchivePath $archive[0].FullName -TestAssembly ./smoke-tests/bin/Release/ShellIntegrationTests.dll
